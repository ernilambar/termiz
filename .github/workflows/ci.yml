name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality gate
    # macOS for the cgo Metal build and the darwin-only tests; the Linux and
    # Windows builds below run cgo-free from the same runner, which is what
    # keeps those targets from silently picking up a cgo dependency.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (macOS)
        run: go build -o /dev/null .

      - name: Build (Linux, cgo-free)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .

      - name: Build (Windows, cgo-free)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
