name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS arm64
    # The Metal backend is Objective-C, so cgo is mandatory on macOS. Every
    # macOS standard runner except the explicit `*-intel` images is Apple
    # silicon; darwin/arm64 is the only target terming ships, so there is no
    # Intel job and no universal binary.
    runs-on: macos-15
    env:
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in main.go; the tag must match it, so a release
          # cannot ship a bundle and binary that disagree.
          version="$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)"
          if [ -z "$version" ]; then
            echo "main.go has no version constant" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match main.go version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          # The display name lives in appinfo.toml; read it instead of spelling
          # the app name here, so a rename is one file.
          app_name="$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' appinfo.toml)"
          if [ -z "$app_name" ]; then
            echo "appinfo.toml has no name" >&2
            exit 1
          fi
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"

          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/terming .
          # Guards the single supported target: a misconfigured GOARCH must
          # fail the release instead of shipping a binary that will not launch.
          arch="$(lipo -archs dist/terming)"
          if [ "$arch" != "arm64" ]; then
            echo "expected arm64 binary, got: $arch" >&2
            exit 1
          fi
          # buildapp is pinned to the go-gui version in go.mod. The manifest
          # supplies the bundle ID and display name; the tag supplies the
          # version, so no second version source exists to fall out of date.
          go run github.com/go-gui-org/go-gui/cmd/buildapp \
            -o "$PWD/dist" \
            -manifest "$PWD/appinfo.toml" \
            -version "$VERSION" \
            dist/terming
          app_arch="$(lipo -archs "dist/$app_name.app/Contents/MacOS/terming")"
          if [ "$app_arch" != "arm64" ]; then
            echo "expected arm64 app binary, got: $app_arch" >&2
            exit 1
          fi
          ditto -c -k --norsrc --noextattr --keepParent \
            "dist/$app_name.app" "dist/$app_name-macos-arm64.zip"
          (cd dist && shasum -a 256 "$app_name-macos-arm64.zip" > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$APP_NAME-macos-arm64.zip"
          bundle="$APP_NAME.app"
          notes="macOS on Apple silicon (arm64) only. Intel Macs are not supported.

          The app is signed ad hoc only (no Developer ID), so Gatekeeper quarantines it after download:

          \`\`\`sh
          unzip $archive
          xattr -dr com.apple.quarantine $bundle
          mv $bundle /Applications/
          open /Applications/$bundle
          \`\`\`"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes" \
            "dist/$archive" dist/SHA256SUMS
