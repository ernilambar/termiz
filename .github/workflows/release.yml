name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Build macOS arm64
    # The Metal backend is Objective-C, so cgo is mandatory on macOS. Every
    # macOS standard runner except the explicit `*-intel` images is Apple
    # silicon; darwin/arm64 is the only target termiz ships, so there is no
    # Intel job and no universal binary.
    runs-on: macos-15
    # Build, bundle and publish; a hang must not reach the 6-hour job cap.
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64
      # Keep every cgo object, including go-gui's, at the macOS 15 floor.
      CGO_CFLAGS: -mmacosx-version-min=15.0
      CGO_LDFLAGS: -mmacosx-version-min=15.0
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the release body can diff against the
          # previous release tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # third_party/go-term is a separate module, so its lockfile is not
          # covered by the root one; both drive the same module cache.
          cache-dependency-path: |
            go.sum
            third_party/go-term/go.sum

      - name: Check tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in main.go; the tag must match it, so a release
          # cannot ship a bundle and binary that disagree.
          version="$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)"
          if [ -z "$version" ]; then
            echo "main.go has no version constant" >&2
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match main.go version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Scripts
        run: bash -n scripts/*.sh

      - name: Test
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test ./...

      # go.mod replaces go-term with third_party/go-term, a nested module that
      # ./... does not descend into; a release must not ship it untested.
      - name: Test patched go-term
        working-directory: third_party/go-term
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          # The display name lives in appinfo.toml; read it instead of spelling
          # the app name here, so a rename is one file.
          app_name="$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' appinfo.toml)"
          if [ -z "$app_name" ]; then
            echo "appinfo.toml has no name" >&2
            exit 1
          fi
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"

          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/termiz .
          # Guards the single supported target: a misconfigured GOARCH must
          # fail the release instead of shipping a binary that will not launch.
          arch="$(lipo -archs dist/termiz)"
          if [ "$arch" != "arm64" ]; then
            echo "expected arm64 binary, got: $arch" >&2
            exit 1
          fi
          # buildapp is pinned to the go-gui version in go.mod. The manifest
          # supplies the bundle ID and display name; the version is main.go's
          # constant, which the step above has checked against the tag.
          go run github.com/go-gui-org/go-gui/cmd/buildapp \
            -o "$PWD/dist" \
            -manifest "$PWD/appinfo.toml" \
            -version "$VERSION" \
            dist/termiz
          app_arch="$(lipo -archs "dist/$app_name.app/Contents/MacOS/termiz")"
          if [ "$app_arch" != "arm64" ]; then
            echo "expected arm64 app binary, got: $app_arch" >&2
            exit 1
          fi
          ./scripts/min-macos.sh "dist/$app_name.app"
          ditto -c -k --norsrc --noextattr --keepParent \
            "dist/$app_name.app" "dist/$app_name-macos-arm64.zip"
          (cd dist && shasum -a 256 "$app_name-macos-arm64.zip" > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$APP_NAME-macos-arm64.zip"
          # The previous reachable tag is the diff base; the first release
          # falls back to the root commit.
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          notes="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          # A re-run after the release already exists (a failure past this
          # point) would otherwise hard-fail on create; replace the assets.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            "dist/$archive" dist/SHA256SUMS ||
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "dist/$archive" dist/SHA256SUMS
