# Identity shared by cmd/buildapp (bundle Info.plist) and the app at run time.
# main.go embeds these bytes, so the bundle ID and the ID go-gui stores
# preferences and permission grants under cannot drift apart.
#
# name is the display name and the only place it is spelled: the scripts and
# the release workflow read it from this file, so a rename edits this line.
#
# version is deliberately absent: the app version lives in main.go's `version`
# constant, which the scripts and the release workflow pass to buildapp as
# -version, so there is one source instead of a second file to bump.
id   = "net.nilambar.termiz"
name = "Termiz"

# The icon is a full-bleed 1024x1024 PNG: an opaque canvas whose artwork the
# system masks to the app-icon squircle on macOS 26 and later. A transparent
# canvas makes the system draw its legacy plate behind the artwork instead.
# buildapp converts the PNG to Contents/Resources/termiz.icns with sips and
# iconutil; assets/icon.svg is the editable source. The path is relative to
# this file.
icon = "assets/icon.png"
